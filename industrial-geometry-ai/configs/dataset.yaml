# 数据生成与 targets（对应 V4 方案第 30/31/56 节）
generator:
  num_images: 5000
  out_dir: data/synthetic
  mode: clean                  # clean(Stage A) | industrial(Stage B)
  objects_per_image: [1, 5]
  negative_only_ratio: 0.10
  min_point_spacing_px: 8      # 硬约束：同 type 关键点间距 ≥ 8px（=2 cells）
  cross_type_spacing_px: 4
  max_bbox_overlap: 0.30
  border_margin_px: 24

target:
  gaussian_size_ratio: 0.25    # r = min(0.25×s_cells, min_neighbor/2)
  radius_clamp: [1, 3]         # cells

roi:                           # 对应 V4 第 18 节
  ratio: 0.10
  min_r: 0.01
  max_r: 0.20

decode:                        # 对应 V4 第 21 节
  peak_threshold: 0.30
  nms_kernel: 3
  topk: 1000
  subpixel_power: 4

grouping:                      # 对应 V4 第 22 节
  seed_tol_factor: 0.35        # × median size
  bidir_tol_factor: 0.25       # × max(s_i, s_j)
  correction_rounds: 3
