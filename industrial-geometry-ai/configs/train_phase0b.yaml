# 第二轮迭代（V4 循环迭代）：12K 数据，续训到 190 epochs
batch_size: 32
grad_accumulation: 1
epochs: 190            # 从 ep100 resume，LR 按 190 重定 cosine（平滑回升再收敛）
optimizer: adamw
lr: 2.0e-4
weight_decay: 1.0e-4
warmup_epochs: 5
scheduler: cosine
amp: true
bf16: true
gradient_clip: 1.0
ema_decay: 0.9999
num_workers: 6
seed: 42
val_interval: 3
val_limit: 250
checkpoint_metric: object_recall

loss_weights:
  heatmap: 1.0
  offset: 1.0
  size: 0.3
  objectness: 0.2

focal:
  alpha: 2
  beta: 4

data_dir: data/stagea,data/stageb,data/phase0_c2,data/phase0_i2,data/r2_clean,data/r2_ind,data/r2_weak
out_dir: out/phase0
